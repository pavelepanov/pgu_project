services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthquest}
      POSTGRES_DB: ${POSTGRES_DB:-healthquest}
    volumes:
      - healthquest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthquest} -d ${POSTGRES_DB:-healthquest}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-healthquest}:${POSTGRES_PASSWORD:-healthquest}@postgres:5432/${POSTGRES_DB:-healthquest}
      BOT_TOKEN: ${BOT_TOKEN:-}
      CORS_ORIGINS: https://${DOMAIN:-localhost}
      WEBAPP_URL: https://${DOMAIN:-localhost}
      BOT_MODE: webhook
      WEBHOOK_BASE_URL: https://${DOMAIN:-localhost}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      INIT_DATA_MAX_AGE_SECONDS: ${INIT_DATA_MAX_AGE_SECONDS:-86400}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  healthquest_postgres_data:
  caddy_data:
  caddy_config:
